name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          for cmd in gateway demo-server admin; do
            go build -trimpath -o "dist/$cmd$suffix" "./cmd/$cmd"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-authz-proxy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
